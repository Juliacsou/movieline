<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#480b17"><meta name="description" content="Luzes, câmera... em que ano? Monte sua linha do tempo de filmes no Movieline, um jogo AltiGames.">
<title>Movieline — Sua sessão de cinema</title>
<link rel="icon" href="./assets/favicon.png?v=11" type="image/png">
<link rel="shortcut icon" href="./assets/favicon.ico?v=11" type="image/x-icon">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=11">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=6">
<link rel="stylesheet" href="./home.css?v=11">
<link rel="stylesheet" href="./game.css?v=11">
<script type="module" src="./js/app.js?v=11"></script>
</head>
<body data-screen="setup">
<div class="home-stage" aria-hidden="true">
 <div class="theatre-glow"></div>
 <div class="theatre-beam theatre-beam-left"></div><div class="theatre-beam theatre-beam-right"></div>
 <div class="theatre-curtain theatre-curtain-left"></div><div class="theatre-curtain theatre-curtain-right"></div>
 <div class="theatre-valance"></div><div class="theatre-floor"></div>
</div>
<div class="app-shell">
<header class="site-header">
 <a class="brand brand-logo-link" href="./index.html" aria-label="Movieline, início"><img class="brand-logo-image" src="./assets/logo-horizontal.png?v=11" alt="Movieline" width="190" height="74"></a>
 <div class="header-actions" role="group" aria-label="Ajuda e som"><button class="icon-button" id="help-button" aria-label="Como jogar" title="Como jogar"><span data-icon="help"></span></button><button class="icon-button" id="sound-button" aria-label="Ativar sons" aria-pressed="false" title="Som"><span data-icon="sound-off"></span></button></div>
</header>
<main id="main-content">
<section id="setup-screen" class="setup-screen" aria-label="Configurar partida">
 <div class="intro" aria-hidden="true">
  <div class="stage-art">
   <div class="stage-center"><img src="./assets/cinema.svg?v=5" width="560" height="530" alt="" draggable="false"></div>
   <img class="stage-prop stage-reel" src="./assets/film-reel.svg" width="144" height="144" alt="" draggable="false">
   <img class="stage-prop stage-clapper" src="./assets/clapper.svg" width="165" height="130" alt="" draggable="false">
   <img class="stage-prop stage-ticket" src="./assets/golden-ticket.svg" width="140" height="90" alt="" draggable="false">
   <img class="stage-prop stage-popcorn" src="./assets/popcorn.svg" width="144" height="184" alt="" draggable="false">
   <span class="stage-spark stage-spark-a">&#10022;</span><span class="stage-spark stage-spark-b">&#10023;</span><span class="stage-spark stage-spark-c">&#10022;</span><span class="stage-spark stage-spark-d">&#10022;</span>
  </div>
 </div>
 <div class="setup-ticket">
  <div class="ticket-heading"><h1><i aria-hidden="true">★</i> MONTE SUA <span>SESSÃO</span> <i aria-hidden="true">★</i></h1><div class="heading-rule" aria-hidden="true"><span></span><b>★</b><span></span></div></div>
  <form id="setup-form" novalidate>
   <div class="counters">
    <fieldset class="counter"><legend><span data-icon="film"></span> FILMES</legend><div class="quantity-bar"><div class="stepper"><button type="button" data-step="films:-1" aria-label="Diminuir filmes">−</button><input id="films-input" aria-label="Quantidade de filmes" inputmode="numeric" type="number" min="1" step="1" value="20"><button type="button" data-step="films:1" aria-label="Aumentar filmes">+</button></div><button type="button" class="infinity-button" id="films-infinity-button" data-infinity="films" aria-pressed="false" aria-label="Ativar filmes infinitos" title="Filmes infinitos">∞</button><input type="checkbox" id="films-infinite" hidden></div></fieldset>
    <fieldset class="counter"><legend><span data-icon="heart"></span> VIDAS</legend><div class="quantity-bar"><div class="stepper"><button type="button" data-step="lives:-1" aria-label="Diminuir vidas">−</button><input id="lives-input" aria-label="Quantidade de vidas" inputmode="numeric" type="number" min="1" step="1" value="5"><button type="button" data-step="lives:1" aria-label="Aumentar vidas">+</button></div><button type="button" class="infinity-button" id="lives-infinity-button" data-infinity="lives" aria-pressed="false" aria-label="Ativar vidas infinitas" title="Vidas infinitas">∞</button><input type="checkbox" id="lives-infinite" hidden></div></fieldset>
   </div>
   <div class="ticket-cutline" aria-hidden="true"><span>★</span></div>
   <div class="category-legend"><button type="button" class="plain-button" id="clear-filters" aria-label="Limpar filtros">↻ LIMPAR</button><span class="legend-item legend-include"><i></i>INCLUIR</span><span class="legend-item legend-exclude"><i></i>EXCLUIR</span></div>
   <div class="category-area" id="category-area" tabindex="0" role="region" aria-label="Categorias de filmes. Toque uma vez para incluir, duas para excluir e três para limpar."><div id="category-list"></div></div>
   <div class="sr-only" id="filter-summary" aria-live="polite"></div>
   <div class="ticket-divider"></div>
   <button class="primary-button start-button" id="start-button" type="submit"><span data-icon="play"></span><span>COMEÇAR A SESSÃO</span><span data-icon="arrow-right"></span></button>
   <div id="setup-error" class="error-message" role="alert" hidden></div>
   <span class="sr-only" id="session-recap"></span>
  </form>
  <button type="button" id="resume-button" class="resume-button" hidden>↻ Retomar sessão</button>
 </div>
</section>
<section id="game-screen" class="game-screen" hidden aria-label="Partida de Movieline">
 <div class="game-topline">
  <div class="game-stats" aria-label="Placar">
   <div class="stat-item" title="Filmes respondidos"><span data-icon="film"></span><span class="sr-only">Filmes: </span><b id="stat-progress">0 / 20</b></div>
   <div class="stat-item" title="Acertos"><span data-icon="trophy"></span><span class="sr-only">Acertos: </span><b id="stat-score">0</b></div>
   <div class="stat-item lives-stat" title="Vidas restantes"><span data-icon="heart"></span><span class="sr-only">Vidas: </span><b id="stat-lives">5</b></div>
  </div><span id="round-label" class="sr-only"></span>
  <button class="icon-button end-session" id="end-button" title="Encerrar partida" aria-label="Encerrar partida"><span data-icon="close"></span></button>
  <div class="progress-rail" aria-hidden="true"><div id="progress-fill"></div></div>
 </div>
 <section class="timeline-panel" aria-label="Linha do tempo">
  <div class="timeline-heading"><span><span data-icon="arrow-left"></span>ANTES</span><h2>LINHA DO TEMPO</h2><span>DEPOIS<span data-icon="arrow-right"></span></span></div>
  <div class="film-perforations" aria-hidden="true"></div>
  <div class="timeline-scroll" id="timeline-scroll" tabindex="0" role="region" aria-label="Linha do tempo horizontal. Arraste o filme ou toque em um espa&#231;o. Use a roda do mouse, dois dedos ou as setas para rolar."><div class="timeline-track" id="timeline-track"></div></div>
  <div class="film-perforations" aria-hidden="true"></div>
  <div class="timeline-bottom"><span class="scroll-cue" aria-hidden="true"><span data-icon="mouse"></span><span data-icon="arrow-left"></span><span data-icon="arrow-right"></span></span><div class="timeline-nav"><button class="icon-button" id="scroll-left" title="Rolar para a esquerda" aria-label="Rolar linha para a esquerda"><span data-icon="arrow-left"></span></button><button class="icon-button" id="scroll-right" title="Rolar para a direita" aria-label="Rolar linha para a direita"><span data-icon="arrow-right"></span></button></div></div>
 </section>
 <div class="turn-panel" id="turn-panel">
  <div id="candidate" class="candidate" tabindex="0" role="group" aria-label="Arraste o filme para a linha do tempo" aria-describedby="placement-label"></div>
  <div class="turn-actions">
   <button class="ticket-action" id="confirm-button" disabled><span>REVELAR</span></button>
   <button class="ticket-action" id="review-answer" hidden><span>VER RESPOSTA</span></button>
  </div><div id="placement-label" class="sr-only" aria-live="polite"></div>
 </div><div id="game-error" class="error-message game-error" role="alert" hidden></div>
</section>
<section id="results-screen" class="results-screen" hidden aria-label="Resultado da partida">
 <div class="results-ticket">
  <div class="eyebrow">FIM DA SESS&Atilde;O</div><div class="results-emblem" aria-hidden="true"><span data-icon="trophy"></span></div>
  <h1 id="results-title">Sess&atilde;o completa!</h1><div class="results-rule" aria-hidden="true"><span></span><b>★</b><span></span></div><p id="results-description"></p>
  <div class="results-stats"><div><b id="results-score">0</b><small>ACERTOS</small></div><div><b id="results-accuracy">0%</b><small>APROVEITAMENTO</small></div><div><b id="results-streak">0</b><small>SEQU&Ecirc;NCIA</small></div></div>
  <p id="results-detail"></p>
  <div class="results-actions"><button class="ticket-action results-primary" id="play-again"><span data-icon="refresh"></span><span>Jogar novamente</span></button><button class="ticket-action results-secondary" id="new-game"><span data-icon="home"></span><span>Novo jogo</span></button></div>
  <div id="results-error" class="error-message" role="alert" hidden></div><button class="plain-button" id="review-timeline">Ver linha do tempo</button>
 </div>
</section>
</main>
<footer class="site-footer"><span class="footer-brand">© ALTIGAMES</span><button class="credits-trigger" id="credits-button"><span>Dados: <b>TMDB</b></span><span class="credits-word">Créditos ↗</span></button></footer>
</div>
<dialog id="info-dialog" class="info-dialog"><button class="dialog-close icon-button" aria-label="Fechar janela"><span data-icon="close"></span></button><div id="dialog-content"></div></dialog>
<dialog id="reveal-popup" class="reveal-popup" aria-labelledby="reveal-title" aria-describedby="reveal-film-name reveal-film-year">
 <div class="clapper-arm" aria-hidden="true"><span></span></div>
 <div class="reveal-popup-card"><div class="clapper-rail" aria-hidden="true"></div>
  <div class="reveal-popup-body">
   <button type="button" class="icon-button reveal-close" id="reveal-close" title="Ver a linha" aria-label="Fechar resposta e ver a linha do tempo"><span data-icon="close"></span></button>
   <h2 id="reveal-title">ACERTOU</h2>
   <p class="reveal-film-name" id="reveal-film-name"></p><p class="reveal-film-year" id="reveal-film-year"></p><p class="reveal-detail" id="reveal-detail"></p>
   <div id="reveal-error" class="error-message" role="alert" hidden></div>
   <button class="ticket-action ticket-next-button" id="popup-next-button" type="button"><span>Pr&oacute;ximo filme</span></button>
  </div>
 </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr-only" id="live-region" aria-live="polite"></div>
<noscript><div class="noscript">Ative o JavaScript no navegador para jogar Movieline.</div></noscript>
<script>if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',function(){var e=document.getElementById('setup-error');e.hidden=false;e.textContent='Este pacote é para publicação. Abra o jogo pelo endereço do site no GitHub Pages, não diretamente pelo arquivo index.html.';document.getElementById('start-button').disabled=true;});}</script>
</body></html>
